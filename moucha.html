<h3>Empatie s mouchami</h3>
<p>Jak jste si již nejspíš všimli, mé rady byly silně neúčinné.</p>
<p>Vím, že chcete chytit mouchu, ale prosím vás, vyslyšte mě.</p>
<p>Mouchy jsou nevinné, sice hodně bzučí, ale za tím bzučením jsou hodné a rozkošné.</p>
<p>Žijí pouze 28 dní, a proto bychom je neměli obtěžovat.</p>
